<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f9ff" id="themeColorMeta">
<title>Work Notes - One UI Cloud</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* =========================================================
   MATERIAL DESIGN 3 (MD3) SYSTEM COLOR TOKENS
   ========================================================= */
:root {
  --md-sys-color-background: #f8f9ff;
  --md-sys-color-on-background: #191c20;
  --md-sys-color-surface: #f2f3f9;
  --md-sys-color-surface-container: #ffffff;
  --md-sys-color-on-surface: #191c20;
  --md-sys-color-on-surface-variant: #44474e;
  --md-sys-color-primary: #2b5ea7;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #d6e3ff;
  --md-sys-color-on-primary-container: #001b3e;
  --md-sys-color-outline: #74777f;
  --md-sys-color-outline-variant: #c4c6d0;
  --md-sys-color-error: #ba1a1a;
  --md-sys-color-error-container: #ffdad6;
  --md-sys-color-success: #198754;
  --md-sys-color-success-container: #e6f7ed;
  --md-sys-color-warning: #d98200;
  --md-sys-color-warning-container: #fff3df;
  
  --md-shape-corner-small: 8px;
  --md-shape-corner-medium: 16px;
  --md-shape-corner-large: 28px;
  --md-shape-corner-full: 9999px;

  --md-elevation-1: 0px 1px 3px rgba(0, 0, 0, 0.12), 0px 1px 2px rgba(0, 0, 0, 0.24);
  --md-elevation-2: 0px 3px 6px rgba(0, 0, 0, 0.15), 0px 2px 4px rgba(0, 0, 0, 0.12);
  --md-elevation-3: 0px 10px 20px rgba(0, 0, 0, 0.15), 0px 3px 6px rgba(0, 0, 0, 0.10);
}

.dark {
  --md-sys-color-background: #111318;
  --md-sys-color-on-background: #e2e2e9;
  --md-sys-color-surface: #191c20;
  --md-sys-color-surface-container: #23262b;
  --md-sys-color-on-surface: #e2e2e9;
  --md-sys-color-on-surface-variant: #c4c6d0;
  --md-sys-color-primary: #a8c8ff;
  --md-sys-color-on-primary: #003062;
  --md-sys-color-primary-container: #004689;
  --md-sys-color-on-primary-container: #d6e3ff;
  --md-sys-color-outline: #8e9099;
  --md-sys-color-outline-variant: #44474e;
  --md-sys-color-error: #ffb4ab;
  --md-sys-color-error-container: #93000a;
  --md-sys-color-success: #53c98a;
  --md-sys-color-success-container: #103822;
  --md-sys-color-warning: #ffb74d;
  --md-sys-color-warning-container: #422800;

  --md-elevation-1: 0px 1px 3px rgba(0, 0, 0, 0.4), 0px 1px 2px rgba(0, 0, 0, 0.3);
  --md-elevation-2: 0px 4px 8px rgba(0, 0, 0, 0.5);
  --md-elevation-3: 0px 12px 24px rgba(0, 0, 0, 0.6);
}

/* =========================================================
   BASE STYLES & LAYOUT (EDGE-TO-EDGE INSETS)
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--md-sys-color-background);
  color: var(--md-sys-color-on-background);
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  transition: background-color 0.3s, color 0.3s;
}

button, input, textarea, select { font-family: inherit; border: none; outline: none; }

/* SVG Icon Helper */
.icon-svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  display: inline-block;
  vertical-align: middle;
}

/* Top App Bar */
.header {
  max-width: 900px;
  margin: auto;
  padding: 16px 20px 8px;
}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.greeting { color: var(--md-sys-color-on-surface-variant); font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.header h1 { font-size: 28px; font-weight: 700; color: var(--md-sys-color-on-background); }
.theme-btn {
  width: 44px; height: 44px; border-radius: var(--md-shape-corner-full);
  background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface);
  box-shadow: var(--md-elevation-1); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; transition: 0.2s;
}
.theme-btn:active { transform: scale(0.95); }

.container { max-width: 900px; margin: auto; padding: 0 20px; }
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.25s ease-out; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Material Search Bar */
.search {
  display: flex; align-items: center; gap: 12px;
  background: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-shape-corner-full);
  padding: 12px 20px; margin-bottom: 16px;
  box-shadow: var(--md-elevation-1);
}
.search span { font-size: 18px; color: var(--md-sys-color-on-surface-variant); }
.search input { width: 100%; background: transparent; color: var(--md-sys-color-on-surface); font-size: 15px; }

/* Material Cards */
.card {
  background: var(--md-sys-color-surface-container);
  border-radius: var(--md-shape-corner-large);
  padding: 20px; box-shadow: var(--md-elevation-1);
  margin-bottom: 16px;
}
.section-title { font-size: 18px; font-weight: 700; margin: 24px 0 12px; color: var(--md-sys-color-on-background); }

/* Ringkasan Dashboard Grid */
.summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.summary-card {
  background: var(--md-sys-color-surface-container);
  border-radius: var(--md-shape-corner-medium);
  padding: 16px; box-shadow: var(--md-elevation-1);
  border: 1px solid var(--md-sys-color-outline-variant);
}
.summary-icon { font-size: 22px; margin-bottom: 8px; display: flex; align-items: center; height: 28px; }
.summary-label { font-size: 12px; color: var(--md-sys-color-on-surface-variant); font-weight: 500; }
.summary-value { font-size: 18px; font-weight: 700; margin-top: 4px; color: var(--md-sys-color-on-surface); }

/* Quick Action Grid */
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick button {
  background: var(--md-sys-color-surface-container);
  color: var(--md-sys-color-on-surface);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-shape-corner-medium);
  padding: 16px 8px; cursor: pointer; font-size: 13px; font-weight: 600;
  box-shadow: var(--md-elevation-1); transition: 0.2s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.quick button:active { background: var(--md-sys-color-primary-container); }
.quick-icon { display: flex; justify-content: center; align-items: center; font-size: 22px; margin-bottom: 6px; height: 28px; }

/* Penjualan Item Card */
.sale-card {
  background: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-shape-corner-medium);
  padding: 18px; margin-bottom: 12px; box-shadow: var(--md-elevation-1);
}
.sale-top { display: flex; justify-content: space-between; gap: 10px; }
.sale-customer { font-size: 16px; font-weight: 700; }
.sale-number { color: var(--md-sys-color-on-surface-variant); font-size: 11px; margin-top: 2px; }
.sale-total { font-size: 16px; font-weight: 700; color: var(--md-sys-color-primary); }
.sale-info { color: var(--md-sys-color-on-surface-variant); font-size: 12px; margin-top: 8px; }

/* Status Badges */
.status { display: inline-block; padding: 4px 10px; border-radius: var(--md-shape-corner-small); font-size: 11px; font-weight: 700; margin-top: 10px; }
.status.lunas { background: var(--md-sys-color-success-container); color: var(--md-sys-color-success); }
.status.kurang { background: var(--md-sys-color-warning-container); color: var(--md-sys-color-warning); }
.status.kembali { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }

.action-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--md-sys-color-outline-variant); }
.btn-sm { border: 0; padding: 8px 14px; border-radius: var(--md-shape-corner-small); font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-update { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.btn-export { background: var(--md-sys-color-success-container); color: var(--md-sys-color-success); }
.btn-delete { background: var(--md-sys-color-error-container); color: var(--md-sys-color-error); }

/* Note Card */
.note {
  background: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-shape-corner-medium);
  padding: 18px; margin-bottom: 12px; box-shadow: var(--md-elevation-1);
}
.note.completed { opacity: 0.6; }
.note-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
.note-checkbox { width: 20px; height: 20px; accent-color: var(--md-sys-color-primary); cursor: pointer; margin-top: 2px; }
.note-title { font-size: 16px; font-weight: 700; flex: 1; }
.note.completed .note-title { text-decoration: line-through; color: var(--md-sys-color-on-surface-variant); }
.note p { color: var(--md-sys-color-on-surface-variant); font-size: 14px; line-height: 1.5; margin-left: 32px; }

/* File Item */
.file {
  display: flex; gap: 14px; align-items: center;
  background: var(--md-sys-color-surface-container);
  border: 1px solid var(--md-sys-color-outline-variant);
  border-radius: var(--md-shape-corner-medium);
  padding: 16px; margin-bottom: 10px; box-shadow: var(--md-elevation-1);
}
.file-icon {
  width: 44px; height: 44px; border-radius: var(--md-shape-corner-small);
  background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
  display: flex; justify-content: center; align-items: center; font-size: 20px;
}
.file-info { flex: 1; }
.file-name { font-weight: 700; font-size: 14px; }
.file-meta { color: var(--md-sys-color-on-surface-variant); font-size: 11px; margin-top: 2px; }
.empty { text-align: center; color: var(--md-sys-color-on-surface-variant); padding: 35px 10px; font-size: 14px; }

/* FAB & Bottom Nav */
.fab {
  position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: var(--md-shape-corner-medium);
  background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
  font-size: 28px; font-weight: 400; box-shadow: var(--md-elevation-3); cursor: pointer; z-index: 20;
  display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background-color 0.2s;
}
.fab:active { transform: scale(0.92); }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: calc(72px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--md-sys-color-surface); border-top: 1px solid var(--md-sys-color-outline-variant); z-index: 10;
}
.nav-inner { max-width: 650px; height: 100%; margin: auto; display: flex; align-items: center; }
.nav {
  flex: 1; border: 0; background: transparent; color: var(--md-sys-color-on-surface-variant);
  cursor: pointer; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.nav-icon-wrapper {
  width: 56px; height: 28px; border-radius: var(--md-shape-corner-full);
  display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease-in-out;
}
.nav-icon { font-size: 18px; display: flex; align-items: center; justify-content: center; }
.nav.active { color: var(--md-sys-color-on-surface); font-weight: 700; }
.nav.active .nav-icon-wrapper {
  background-color: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container);
}

/* MODALS & FORMS */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(2px);
}
.overlay.show { display: flex; }
.modal {
  width: 100%; max-width: 650px; max-height: 88vh; overflow-y: auto;
  background: var(--md-sys-color-surface-container);
  border-radius: var(--md-shape-corner-large) var(--md-shape-corner-large) 0 0;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow: var(--md-elevation-3);
  animation: slideUp 0.25s cubic-bezier(0, 0, 0.2, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-head h2 { font-size: 20px; font-weight: 700; }
.close {
  width: 36px; height: 36px; border-radius: var(--md-shape-corner-full);
  background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface);
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;
}

.form-group { margin-bottom: 14px; }
.form-group label { display: block; color: var(--md-sys-color-on-surface-variant); font-size: 12px; font-weight: 500; margin-bottom: 6px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-shape-corner-small);
  background: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); padding: 12px 14px; font-size: 14px; transition: border-color 0.2s;
}
.form-group textarea { min-height: 90px; resize: vertical; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--md-sys-color-primary); border-width: 2px; }

.items-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 12px; }
.items-title { font-weight: 700; font-size: 15px; }
.add-item { border: 0; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-radius: var(--md-shape-corner-full); padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 12px; }
.item-row { background: var(--md-sys-color-background); border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-shape-corner-medium); padding: 14px; margin-bottom: 10px; }
.item-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
.item-grid .full { grid-column: 1/-1; }
.item-field { display: flex; flex-direction: column; }
.item-field label { font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 4px; }
.item-field input { width: 100%; border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-shape-corner-small); background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface); padding: 8px 10px; font-size: 13px; }
.item-total { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--md-sys-color-outline-variant); font-size: 12px; }
.item-total b { color: var(--md-sys-color-primary); font-size: 13px; }
.remove-item { border: 0; background: var(--md-sys-color-error-container); color: var(--md-sys-color-error); border-radius: var(--md-shape-corner-small); padding: 4px 10px; cursor: pointer; font-size: 11px; font-weight: 600; }

.total-box { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); border-radius: var(--md-shape-corner-medium); padding: 16px; margin: 16px 0; }
.total-line { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
.grand-total { font-size: 18px; font-weight: 700; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.1); margin-top: 6px; }
.payment-result { border-radius: var(--md-shape-corner-small); padding: 12px; margin: 12px 0; font-size: 13px; }
.payment-lunas { background: var(--md-sys-color-success-container); color: var(--md-sys-color-success); }
.payment-kurang { background: var(--md-sys-color-warning-container); color: var(--md-sys-color-warning); }
.payment-kembali { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }
.submit { width: 100%; border: 0; border-radius: var(--md-shape-corner-full); padding: 14px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); font-weight: 700; cursor: pointer; font-size: 15px; box-shadow: var(--md-elevation-1); margin-top: 8px; }

/* Receipt Export PNG Styling */
#receipt-container { display: none; }
.receipt-wrapper { width: 320px; background: #fff; color: #000; padding: 20px; font-family: 'Courier New', Courier, monospace; }
.receipt-header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 12px; margin-bottom: 12px; }
.receipt-header h3 { font-size: 18px; font-weight: bold; margin-bottom: 3px; text-transform: uppercase; }
.receipt-header p { font-size: 11px; }
.receipt-info { font-size: 11px; margin-bottom: 10px; border-bottom: 1px dashed #000; padding-bottom: 8px; }
.receipt-table { width: 100%; font-size: 11px; border-collapse: collapse; margin-bottom: 10px; }
.receipt-table th, .receipt-table td { text-align: left; padding: 3px 0; }
.receipt-table .num { text-align: right; }
.receipt-divider { border-top: 1px dashed #000; margin: 8px 0; }
.receipt-summary { font-size: 11px; margin-top: 6px; }
.receipt-summary-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
.receipt-footer { text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #000; font-size: 11px; }

@media(max-width:480px){ .item-grid { grid-template-columns: 1fr 1fr; } }
@media(min-width:700px){ .summary { grid-template-columns: repeat(4, 1fr); } .overlay { align-items: center; } .modal { border-radius: var(--md-shape-corner-large); } }

.customer-card,.job-card,.debt-card{ background:var(--md-sys-color-surface-container); border:1px solid var(--md-sys-color-outline-variant); border-radius:var(--md-shape-corner-medium); padding:16px;margin-bottom:10px;box-shadow:var(--md-elevation-1) }
.customer-top,.job-top,.debt-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.customer-name,.job-title,.debt-name{font-size:15px;font-weight:700}
.customer-meta,.job-meta,.debt-meta{font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:5px}
.job-status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;margin-top:9px}
.job-menunggu{background:var(--md-sys-color-warning-container);color:var(--md-sys-color-warning)}
.job-diproses{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-primary)}
.job-selesai,.job-diambil{background:var(--md-sys-color-success-container);color:var(--md-sys-color-success)}
.job-dibatalkan{background:var(--md-sys-color-error-container);color:var(--md-sys-color-error)}
.stat-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat-mini div{padding:10px;border-radius:12px;background:var(--md-sys-color-background);text-align:center}
.stat-mini b{display:block;font-size:13px}
.stat-mini span{font-size:10px;color:var(--md-sys-color-on-surface-variant)}
.filter-row{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.filter-row button{white-space:nowrap;border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface);padding:8px 12px;border-radius:999px;font-size:12px;cursor:pointer}
.filter-row button.active{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);font-weight:700}
@media(max-width:480px){.stat-mini{grid-template-columns:1fr 1fr}.bottom-nav .nav{font-size:10px}.nav-icon{font-size:16px}}
</style>
</head>
<body>

<!-- TEMPLATE SVG DEBT COLLECTION ROUND ICON -->
<svg style="display: none;">
  <symbol id="icon-debt-collection-round" viewBox="0 0 24 24">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zM3.5 12a8.5 8.5 0 1117 0 8.5 8.5 0 01-17 0zm11.75-3.25a.75.75 0 000-1.5h-2.5V6a.75.75 0 00-1.5 0v1.25h-.5a2.75 2.75 0 000 5.5h2.5a1.25 1.25 0 110 2.5h-3.5a.75.75 0 000 1.5h2.5V18a.75.75 0 001.5 0v-1.25h.5a2.75 2.75 0 000-5.5h-2.5a1.25 1.25 0 110-2.5h3.5z"/>
  </symbol>
</svg>

<header class="header">
  <div class="header-top">
    <div>
      <div class="greeting">Catatan pekerjaan pribadi</div>
      <h1 id="pageTitle">Beranda</h1>
    </div>
    <button class="theme-btn" onclick="toggleDark()" title="Ubah Tema">◐</button>
  </div>
</header>

<main class="container">
  <section id="home" class="page active">
    <div class="card">
      <div class="greeting">Hari ini</div>
      <h2 id="today" style="font-size: 22px; font-weight: 700; margin-top: 4px;"></h2>
    </div>

    <div class="section-title">Ringkasan</div>
    <div class="summary">
      <div class="summary-card"><div class="summary-icon">💰</div><div class="summary-label">Total Penjualan</div><div class="summary-value" id="dashboardSales">Rp0</div></div>
      <div class="summary-card"><div class="summary-icon">🧾</div><div class="summary-label">Transaksi</div><div class="summary-value" id="dashboardTransactions">0</div></div>
      <div class="summary-card"><div class="summary-icon">📝</div><div class="summary-label">Notes</div><div class="summary-value" id="dashboardNotes">0</div></div>
      <div class="summary-card"><div class="summary-icon">📁</div><div class="summary-label">Files</div><div class="summary-value" id="dashboardFiles">0</div></div>
      <div class="summary-card"><div class="summary-icon">👥</div><div class="summary-label">Pelanggan</div><div class="summary-value" id="dashboardCustomers">0</div></div>
      <div class="summary-card"><div class="summary-icon">📋</div><div class="summary-label">Pekerjaan Aktif</div><div class="summary-value" id="dashboardJobs">0</div></div>

        <div class="summary-icon">

    <div class="section-title">Akses cepat</div>
    <div class="quick">
      <button onclick="openSaleModal()"><span class="quick-icon">💰</span>Penjualan</button>
      <button onclick="openNoteModal()"><span class="quick-icon">📝</span>Note</button>
      <button onclick="openFileModal()"><span class="quick-icon">📁</span>File</button>
      <button onclick="openCustomerModal()"><span class="quick-icon">👤</span>Pelanggan</button>
      <button onclick="openJobModal()"><span class="quick-icon">📋</span>Pekerjaan</button>
      <button onclick="showPage('debts',document.querySelectorAll('.nav')[6])">
        <span class="quick-icon">
          <svg class="icon-svg"><use href="#icon-debt-collection-round"/></svg>

        Piutang
      </button>

    <div class="section-title">Backup & Restore</div>
    <div class="quick" style="grid-template-columns: repeat(2, 1fr);">
      <button onclick="exportAllData()"><span class="quick-icon">📤</span>Ekspor Data (JSON)</button>
      <button onclick="triggerImport()"><span class="quick-icon">📥</span>Impor Data (JSON)</button>

    <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importAllData(event)">

  <section id="customers" class="page">

    <div id="jobsList"></div>

  <section id="debts" class="page">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getDatabase, 
    ref, 
    push, 
    remove, 
    update,
    set,
    onValue 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBEQ112S4jQYD8lFMdaQ2UDYZ3KtgewQgI",
    authDomain: "project-7cbcc.firebaseapp.com",
    databaseURL: "https://project-7cbcc-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "project-7cbcc",
    storageBucket: "project-7cbcc.firebasestorage.app",
    messagingSenderId: "644697990603",
    appId: "1:644697990603:web:54be670bc27a1c251a424e",
    measurementId: "G-7FPXFCX3JW"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const salesRef = ref(db, "sales");
  const notesRef = ref(db, "notes");
  const filesRef = ref(db, "files");
  const customersRef = ref(db, "customers");
  const jobsRef = ref(db, "jobs");

  let sales = [];
  let notes = [];
  let files = [];
  let customers = [];
  let jobs = [];
  let currentPage = "home", itemCounter = 0, currentJobFilter = "Semua";

  onValue(salesRef, (snapshot) => {
    const data = snapshot.val();
    sales = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
    renderAll();
  });

  onValue(notesRef, (snapshot) => {
    const data = snapshot.val();
    notes = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
    renderAll();
  });

  onValue(filesRef, (snapshot) => {
    const data = snapshot.val();
    files = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
    renderAll();
  });

  onValue(customersRef, (snapshot) => {
    const data = snapshot.val();
    customers = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
    renderAll();
  });

  onValue(jobsRef, (snapshot) => {
    const data = snapshot.val();
    jobs = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
    renderAll();
  });

  window.showPage = function(page, button) {
    currentPage = page;
    document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
    document.getElementById(page).classList.add("active");
    document.querySelectorAll(".nav").forEach(x => x.classList.remove("active"));
    button.classList.add("active");
    document.getElementById("pageTitle").textContent = {home:"Beranda", sales:"Penjualan", notes:"Note", files:"Files", customers:"Pelanggan", jobs:"Pekerjaan", debts:"Piutang"}[page];
    renderAll();
  };

  window.toggleDark = function() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("dark", isDark);
    document.getElementById("themeColorMeta").setAttribute("content", isDark ? "#111318" : "#f8f9ff");
  };

  if(localStorage.getItem("dark") === "true") {
    document.body.classList.add("dark");
    document.getElementById("themeColorMeta").setAttribute("content", "#111318");
  }

  window.openModal = function(title, html) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalContent").innerHTML = html;
    document.getElementById("overlay").classList.add("show");
  };

  window.closeModal = function() {
    document.getElementById("overlay").classList.remove("show");
  };

  // --- EKSPOR & IMPOR DATA (JSON) ---
  window.exportAllData = function() {
    let backupData = {
      sales: sales,
      notes: notes,
      files: files,
      customers: customers,
      jobs: jobs,
      exportedAt: new Date().toISOString()
    };

    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    let downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `Backup_WorkNotes_${todayISO()}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  };

  window.triggerImport = function() {
    document.getElementById("importFileInput").click();
  };

  window.importAllData = function(event) {
    let file = event.target.files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload = async function(e) {
      try {
        let imported = JSON.parse(e.target.result);
        if(!confirm("Proses ini akan mengunggah data dari file ke Cloud. Lanjutkan?")) return;

        if(imported.sales && Array.isArray(imported.sales)) {
          for(let item of imported.sales) {
            let id = item.id;
            let data = {...item};
            delete data.id;
            await set(ref(db, "sales/" + (id || Date.now())), data);
          }
        }

        if(imported.notes && Array.isArray(imported.notes)) {
          for(let item of imported.notes) {
            let id = item.id;
            let data = {...item};
            delete data.id;
            await set(ref(db, "notes/" + (id || Date.now())), data);
          }
        }

        if(imported.files && Array.isArray(imported.files)) {
          for(let item of imported.files) {
            let id = item.id;
            let data = {...item};
            delete data.id;
            await set(ref(db, "files/" + (id || Date.now())), data);
          }
        }

        if(imported.customers && Array.isArray(imported.customers)) {
          for(let item of imported.customers) {
            let id = item.id;
            let data = {...item};
            delete data.id;
            await set(ref(db, "customers/" + (id || Date.now())), data);
          }
        }

        if(imported.jobs && Array.isArray(imported.jobs)) {
          for(let item of imported.jobs) {
            let id = item.id;
            let data = {...item};
            delete data.id;
            await set(ref(db, "jobs/" + (id || Date.now())), data);
          }
        }

        alert("Berhasil mengimpor data ke Cloud!");
      } catch(err) {
        alert("Gagal membaca file backup: " + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  };

  // --- NOTE CHECKLIST & ACTIONS ---
  window.openNoteModal = function(id = null) {
    let note = id ? notes.find(n => n.id === id) : null;
    let isEdit = !!note;

    openModal(isEdit ? "Edit Note" : "Tambah Note", `
      <div class="form-group"><label>Judul Catatan</label><input id="noteTitle" value="${note ? escapeHTML(note.title) : ''}" placeholder="Judul catatan"></div>
      <div class="form-group"><label>Isi Catatan</label><textarea id="noteContent" placeholder="Tulis catatan...">${note ? escapeHTML(note.content) : ''}</textarea></div>
      <div class="form-group"><label>Kategori</label>
        <select id="noteCategory">
          <option ${note && note.category === 'Pekerjaan' ? 'selected' : ''}>Pekerjaan</option>
          <option ${note && note.category === 'Pelanggan' ? 'selected' : ''}>Pelanggan</option>
          <option ${note && note.category === 'Ide' ? 'selected' : ''}>Ide</option>
          <option ${note && note.category === 'Lainnya' ? 'selected' : ''}>Lainnya</option>
        </select>
      </div>
      <button class="submit" onclick="saveNote('${id || ''}')">${isEdit ? 'Perbarui Note' : 'Simpan Note (Cloud)'}</button>
    `);
  };

  window.saveNote = async function(id = '') {
    let title = document.getElementById("noteTitle").value.trim(),
        content = document.getElementById("noteContent").value.trim(),
        category = document.getElementById("noteCategory").value;
    if(!title && !content) return alert("Isi note terlebih dahulu.");

    try {
      if(id) {
        await update(ref(db, "notes/" + id), { title: title || "Tanpa judul", content, category });
      } else {
        await push(notesRef, {
          title: title || "Tanpa judul", content, category, completed: false,
          date: new Date().toLocaleString("id-ID"), timestamp: Date.now()
        });
      }
      closeModal();
    } catch(e) {
      alert("Gagal menyimpan catatan: " + e.message);
    }
  };

  window.toggleNoteStatus = async function(id, currentStatus) {
    try {
      await update(ref(db, "notes/" + id), { completed: !currentStatus });
    } catch(e) {
      alert("Gagal mengubah status catatan: " + e.message);
    }
  };

  window.deleteNote = async function(id) {
    if(!confirm("Hapus catatan ini?")) return;
    try {
      await remove(ref(db, "notes/" + id));
    } catch(e) {
      alert("Gagal menghapus: " + e.message);
    }
  };

  function renderNotes(data = notes) {
    let list = document.getElementById("notesList");
    if(!data.length){ list.innerHTML = `<div class="empty">Belum ada catatan.</div>`; return; }
    list.innerHTML = data.map(note => `
      <div class="note ${note.completed ? 'completed' : ''}">
        <div class="note-header">
          <input type="checkbox" class="note-checkbox" ${note.completed ? 'checked' : ''} onclick="toggleNoteStatus('${note.id}', ${!!note.completed})">
          <div class="note-title">${escapeHTML(note.title)}</div>
        </div>
        <p>${escapeHTML(note.content)}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;margin-left:32px">
          <div style="color:var(--md-sys-color-on-surface-variant);font-size:11px">${escapeHTML(note.category)} · ${note.date}</div>
          <div>
            <button class="btn-sm btn-update" onclick="openNoteModal('${note.id}')">Edit</button>
            <button class="btn-sm btn-delete" onclick="deleteNote('${note.id}')">Hapus</button>
          </div>
        </div>
      </div>
    `).join("");
  }


  // ===== PELANGGAN =====
  window.openCustomerModal = function(id = null) {
    const c = id ? customers.find(x => x.id === id) : null;
    openModal(c ? "Edit Pelanggan" : "Tambah Pelanggan", `
      <div class="form-group"><label>Nama Pelanggan</label><input id="custName" value="${c ? escapeHTML(c.name) : ''}" placeholder="Nama pelanggan"></div>
      <div class="form-group"><label>No. HP / WhatsApp</label><input id="custPhone" value="${c ? escapeHTML(c.phone) : ''}" placeholder="08xxxxxxxxxx"></div>
      <div class="form-group"><label>Alamat</label><textarea id="custAddress" placeholder="Alamat pelanggan">${c ? escapeHTML(c.address) : ''}</textarea></div>
      <button class="submit" onclick="saveCustomer('${id || ''}')">${c ? 'Perbarui Pelanggan' : 'Simpan Pelanggan'}</button>
    `);
  };

  window.saveCustomer = async function(id = '') {
    const name = document.getElementById("custName").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const address = document.getElementById("custAddress").value.trim();
    if(!name) return alert("Nama pelanggan harus diisi.");
    try {
      const data = {name, phone, address, updatedAt: Date.now()};
      if(id) await update(ref(db, "customers/" + id), data);
      else await push(customersRef, {...data, createdAt: Date.now()});
      closeModal();
    } catch(e) { alert("Gagal menyimpan pelanggan: " + e.message); }
  };

  window.deleteCustomer = async function(id) {
    if(!confirm("Hapus data pelanggan ini? Riwayat transaksi tidak ikut terhapus.")) return;
    try { await remove(ref(db, "customers/" + id)); }
    catch(e) { alert("Gagal menghapus pelanggan: " + e.message); }
  };

  window.searchCustomers = function(q) {
    q = q.toLowerCase();
    renderCustomers(customers.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').toLowerCase().includes(q)));
  };

  function renderCustomers(data = customers) {
    const list = document.getElementById("customersList");
    if(!data.length){ list.innerHTML = '<div class="empty">Belum ada pelanggan.</div>'; return; }
    list.innerHTML = data.map(c => {
      const csales = sales.filter(s => s.customer === c.name || (c.phone && s.phone === c.phone));
      const total = csales.reduce((a,s)=>a+(Number(s.total)||0),0);
      const debt = csales.reduce((a,s)=>a+(s.status==="Kekurangan" ? Number(s.difference)||0 : 0),0);
      return `<div class="customer-card">
        <div class="customer-top">
          <div><div class="customer-name">👤 ${escapeHTML(c.name)}</div>
          <div class="customer-meta">${c.phone ? '📱 '+escapeHTML(c.phone) : 'Tidak ada nomor HP'}</div>
          ${c.address ? `<div class="customer-meta">📍 ${escapeHTML(c.address)}</div>` : ''}</div>
          <div>
            <button class="btn-sm btn-update" onclick="openCustomerModal('${c.id}')">Edit</button>
            <button class="btn-sm btn-delete" onclick="deleteCustomer('${c.id}')">Hapus</button>
          </div>
        </div>
        <div class="stat-mini">
          <div><b>${csales.length}</b><span>Transaksi</span></div>
          <div><b>${formatRupiah(total)}</b><span>Total Belanja</span></div>
          <div><b>${formatRupiah(debt)}</b><span>Piutang</span></div>
        </div>
      </div>`;
    }).join("");
  }

  // ===== PEKERJAAN =====
  window.openJobModal = function(id = null) {
    const j = id ? jobs.find(x => x.id === id) : null;
    const customerOptions = customers.map(c => `<option value="${escapeHTML(c.name)}" ${j && j.customer===c.name ? 'selected':''}>${escapeHTML(c.name)}${c.phone ? ' — '+escapeHTML(c.phone):''}</option>`).join("");
    openModal(j ? "Edit Pekerjaan" : "Tambah Pekerjaan", `
      <div class="form-group"><label>Pelanggan</label>
        <select id="jobCustomer"><option value="">-- Pilih pelanggan --</option>${customerOptions}</select>
      </div>
      <div class="form-group"><label>Nama Pekerjaan</label><input id="jobTitle" value="${j ? escapeHTML(j.title):''}" placeholder="Contoh: Cetak undangan 200 lembar"></div>
      <div class="form-group"><label>Detail Pekerjaan</label><textarea id="jobDescription" placeholder="Ukuran, bahan, jumlah, catatan...">${j ? escapeHTML(j.description):''}</textarea></div>
      <div class="form-group"><label>Status</label><select id="jobStatus">
        ${["Menunggu","Diproses","Selesai","Diambil","Dibatalkan"].map(s=>`<option ${j && j.status===s?'selected':''}>${s}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>Deadline</label><input id="jobDueDate" type="date" value="${j ? (j.dueDate||''):''}"></div>
      <div class="form-group"><label>Harga / Nilai Pekerjaan</label><input id="jobPrice" type="number" min="0" value="${j ? (j.price||0):0}"></div>
      <button class="submit" onclick="saveJob('${id || ''}')">${j ? 'Perbarui Pekerjaan' : 'Simpan Pekerjaan'}</button>
    `);
  };

  window.saveJob = async function(id = '') {
    const customer = document.getElementById("jobCustomer").value.trim();
    const title = document.getElementById("jobTitle").value.trim();
    const description = document.getElementById("jobDescription").value.trim();
    const status = document.getElementById("jobStatus").value;
    const dueDate = document.getElementById("jobDueDate").value;
    const price = Number(document.getElementById("jobPrice").value) || 0;
    if(!title) return alert("Nama pekerjaan harus diisi.");
    try {
      const data = {customer,title,description,status,dueDate,price,updatedAt:Date.now()};
      if(id) await update(ref(db, "jobs/" + id), data);
      else await push(jobsRef, {...data, number:"JOB-"+Date.now().toString().slice(-6),createdAt:Date.now()});
      closeModal();
    } catch(e) { alert("Gagal menyimpan pekerjaan: " + e.message); }
  };

  window.updateJobStatus = async function(id, status) {
    try { await update(ref(db, "jobs/" + id), {status, updatedAt:Date.now()}); }
    catch(e) { alert("Gagal mengubah status pekerjaan: " + e.message); }
  };

  window.deleteJob = async function(id) {
    if(!confirm("Hapus pekerjaan ini?")) return;
    try { await remove(ref(db, "jobs/" + id)); }
    catch(e) { alert("Gagal menghapus pekerjaan: " + e.message); }
  };

  window.filterJobs = function(status, btn) {
    currentJobFilter = status;
    document.querySelectorAll("#jobFilters button").forEach(b=>b.classList.remove("active"));
    if(btn) btn.classList.add("active");
    renderJobs();
  };

  function renderJobs(data = jobs) {
    const list = document.getElementById("jobsList");
    if(currentJobFilter !== "Semua") data = data.filter(j=>j.status===currentJobFilter);
    if(!data.length){ list.innerHTML = '<div class="empty">Belum ada pekerjaan.</div>'; return; }
    list.innerHTML = data.map(j => {
      const cls = "job-" + (j.status||"Menunggu").toLowerCase();
      const customer = customers.find(c=>c.name===j.customer);
      return `<div class="job-card">
        <div class="job-top">
          <div><div class="job-title">📋 ${escapeHTML(j.title)}</div>
          <div class="job-meta">${j.number||''} · ${escapeHTML(j.customer||'Tanpa pelanggan')}</div></div>
          <b>${formatRupiah(j.price||0)}</b>
        </div>
        <span class="job-status ${cls}">${escapeHTML(j.status||'Menunggu')}</span>
        ${j.description ? `<div class="job-meta">📝 ${escapeHTML(j.description)}</div>`:''}
        ${j.dueDate ? `<div class="job-meta">📅 Deadline: <b>${formatDate(j.dueDate)}</b></div>`:''}
        ${customer && customer.phone ? `<div class="job-meta">📱 ${escapeHTML(customer.phone)}</div>`:''}
        <div class="action-row">
          <button class="btn-sm btn-update" onclick="openJobModal('${j.id}')">Edit</button>
          <button class="btn-sm btn-export" onclick="updateJobStatus('${j.id}','${j.status==='Selesai'?'Diambil':'Selesai'}')">${j.status==='Selesai'?'Tandai Diambil':'Tandai Selesai'}</button>
          <button class="btn-sm btn-delete" onclick="deleteJob('${j.id}')">Hapus</button>
        </div>
      </div>`;
    }).join("");
  }

  // ===== PIUTANG =====
  function renderDebts() {
    const debtSales = sales.filter(s=>s.status==="Kekurangan" && Number(s.difference)>0);
    const totalDebt = debtSales.reduce((a,s)=>a+(Number(s.difference)||0),0);
    document.getElementById("debtTotal").textContent = formatRupiah(totalDebt);
    const list = document.getElementById("debtsList");
    if(!debtSales.length){ list.innerHTML='<div class="empty">Tidak ada piutang. Semua transaksi lunas. 🎉</div>'; return; }
    list.innerHTML = debtSales.map(s=>`
      <div class="debt-card">
        <div class="debt-top">
          <div><div class="debt-name"><svg class="icon-svg"><use href="#icon-debt-collection-round"/></svg> ${escapeHTML(s.customer)}</div>
          <div class="debt-meta">${s.number} · ${s.date}</div>
          ${s.phone?`<div class="debt-meta">📱 ${escapeHTML(s.phone)}</div>`:''}
          ${s.dueDate?`<div class="debt-meta">📅 Jatuh tempo: <b>${formatDate(s.dueDate)}</b></div>`:''}</div>
          <div style="text-align:right"><div style="font-weight:700;color:var(--md-sys-color-warning)">${formatRupiah(s.difference)}</div><div class="debt-meta">sisa</div></div>
        </div>
        <div class="action-row">
          <button class="btn-sm btn-update" onclick="openUpdatePaymentModal('${s.id}')"><svg class="icon-svg" style="width:14px;height:14px;"><use href="#icon-debt-collection-round"/></svg> Bayar</button>
          <button class="btn-sm btn-export" onclick="exportReceiptPNG('${s.id}')">🖼️ Struk</button>
        </div>
      </div>`).join("");
  }

  // --- PEMBAYARAN & EKSPOR STRUK PNG ---
  window.openUpdatePaymentModal = function(id) {
    let sale = sales.find(s => s.id === id);
    if(!sale) return;

    openModal("Update Pembayaran", `
      <div style="margin-bottom:15px;background:var(--md-sys-color-background);padding:14px;border-radius:var(--md-shape-corner-medium)">
        <div style="font-weight:700;font-size:15px">${escapeHTML(sale.customer)} (${sale.number})</div>
        <div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);margin-top:4px">Total Tagihan: <b>${formatRupiah(sale.total)}</b></div>
      </div>
      <div class="form-group">
        <label>Jumlah Pembayaran Baru (Rp)</label>
        <input id="newPayment" type="number" min="0" value="${sale.payment}" placeholder="0" oninput="calculateNewPayment(${sale.total})">
      </div>
      <div id="paymentResultUpdate"></div>
      <button class="submit" onclick="savePaymentUpdate('${sale.id}', ${sale.total})" style="margin-top:10px">Perbarui Pembayaran</button>
    `);
    calculateNewPayment(sale.total);
  };

  window.calculateNewPayment = function(total) {
    let payment = Number(document.getElementById("newPayment")?.value) || 0,
        result = document.getElementById("paymentResultUpdate");
    if(!result) return;
    if(payment === total) result.innerHTML = `<div class="payment-result payment-lunas"><b>🟢 LUNAS</b><br>Pembayaran sesuai total tagihan.</div>`;
    else if(payment < total) result.innerHTML = `<div class="payment-result payment-kurang"><b>🟠 KEKURANGAN</b><br>Kurang: <strong>${formatRupiah(total - payment)}</strong></div>`;
    else result.innerHTML = `<div class="payment-result payment-kembali"><b>🔵 KEMBALIAN</b><br>Kembali: <strong>${formatRupiah(payment - total)}</strong></div>`;
  };

  window.savePaymentUpdate = async function(id, total) {
    let payment = Number(document.getElementById("newPayment").value) || 0;
    let status = payment === total ? "Lunas" : payment < total ? "Kekurangan" : "Kembalian";
    let difference = Math.abs(total - payment);

    try {
      await update(ref(db, "sales/" + id), { payment, status, difference });
      closeModal();
    } catch(e) {
      alert("Gagal memperbarui pembayaran: " + e.message);
    }
  };

  window.exportReceiptPNG = function(id) {
    let sale = sales.find(s => s.id === id);
    if(!sale) return;

    let container = document.getElementById("receipt-container");
    container.style.display = "block";

    let itemsHtml = (sale.items || []).map(item => `
      <tr>
        <td colspan="3">${escapeHTML(item.name)}</td>
      </tr>
      <tr>
        <td style="color:#555">${item.qty} x ${formatRupiah(item.price)}</td>
        <td></td>
        <td class="num">${formatRupiah(item.total)}</td>
      </tr>
    `).join("");

    let paymentText = sale.status === "Kekurangan" ? "Sisa Tagihan" : "Kembalian";

    container.innerHTML = `
      <div class="receipt-wrapper" id="receipt-card">
        <div class="receipt-header">
          <h3>WORK NOTES STORE</h3>
          <p>Nota Transaksi Penjualan</p>
        </div>
        <div class="receipt-info">
          <div>No.   : <b>${sale.number}</b></div>
          <div>Tgl   : ${sale.date}</div>
          <div>Nama  : ${escapeHTML(sale.customer)}</div>
          ${sale.phone ? `<div>HP    : ${escapeHTML(sale.phone)}</div>` : ''}
        </div>
        <table class="receipt-table">
          ${itemsHtml}
        </table>
        <div class="receipt-divider"></div>
        <div class="receipt-summary">
          <div class="receipt-summary-line"><span>TOTAL</span> <b>${formatRupiah(sale.total)}</b></div>
          <div class="receipt-summary-line"><span>DIBAYAR</span> <span>${formatRupiah(sale.payment)}</span></div>
          <div class="receipt-summary-line"><span>${paymentText}</span> <span>${formatRupiah(sale.difference)}</span></div>
          <div class="receipt-summary-line"><span>STATUS</span> <b>${sale.status.toUpperCase()}</b></div>
        </div>
        <div class="receipt-footer">
          <p>Terima kasih atas kunjungan Anda!</p>
          <small>${sale.createdAt || ''}</small>
        </div>
      </div>
    `;

    html2canvas(document.getElementById("receipt-card")).then(canvas => {
      let link = document.createElement('a');
      link.download = `Struk_${sale.number}_${sale.customer}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      container.style.display = "none";
    }).catch(err => {
      alert("Gagal mengekspor struk: " + err.message);
      container.style.display = "none";
    });
  };

  // --- FORM TRANSAKSI ---
  window.openSaleModal = function() {
    itemCounter = 0;
    openModal("Tambah Penjualan", `
      <div class="form-group"><label>Nama Pelanggan</label><input id="customer" placeholder="Contoh: Budi"></div>
      <div class="form-group"><label>No. HP / Kontak (opsional)</label><input id="phone" placeholder="08xxxxxxxxxx"></div>
      <div class="form-group"><label>Tanggal Transaksi</label><input id="saleDate" type="date" value="${todayISO()}"></div>
      <div class="items-header"><div class="items-title">Daftar Barang</div><button class="add-item" onclick="addItem()">+ Barang</button></div>
      <div id="items"></div>
      <div class="total-box"><div class="total-line"><span>Total Barang</span><b id="itemCount">0</b></div><div class="total-line grand-total"><span>Total Tagihan</span><span id="grandTotal">Rp0</span></div></div>
      <div class="form-group"><label>Jumlah Pembayaran</label><input id="payment" type="number" min="0" placeholder="0" oninput="calculatePayment()"></div>
      <div id="paymentResult"></div>
      <div class="form-group"><label>Jatuh Tempo</label><input id="dueDate" type="date"><small style="display:block;color:var(--md-sys-color-on-surface-variant);margin-top:4px">Isi jika ada pembayaran yang belum lunas.</small></div>
      <div class="form-group"><label>Keterangan</label><textarea id="description" placeholder="Catatan tambahan..."></textarea></div>
      <div class="form-group"><label>Status Pekerjaan (opsional)</label><select id="saleJobStatus">
        <option value="">Tidak membuat pekerjaan</option>
        <option>Menunggu</option><option>Diproses</option><option>Selesai</option><option>Diambil</option>
      </select></div>
      <button class="submit" onclick="saveSale()">Simpan Transaksi (Cloud)</button>
    `);
    addItem();
  };

  window.addItem = function() {
    itemCounter++; let id = itemCounter;
    document.getElementById("items").insertAdjacentHTML("beforeend", `
      <div class="item-row" id="item-${id}">
        <div class="item-grid">
          <div class="item-field full">
            <label>Nama Barang</label>
            <input class="item-name" placeholder="Contoh: Banner 3x1m">
          </div>
          <div class="item-field">
            <label>Harga Satuan</label>
            <input class="item-price" type="number" min="0" placeholder="50000" oninput="calculateTotal()">
          </div>
          <div class="item-field">
            <label>Jumlah</label>
            <input class="item-qty" type="number" min="1" value="1" oninput="calculateTotal()">
          </div>
        </div>
        <div class="item-total">
          <span>Subtotal: <b class="row-total">Rp0</b></span>
          <button class="remove-item" onclick="removeItem(${id})">Hapus</button>
        </div>
      </div>
    `);
    calculateTotal();
  };

  window.removeItem = function(id) {
    let e = document.getElementById("item-" + id);
    if(e) e.remove();
    calculateTotal();
  };

  window.calculateTotal = function() {
    let total = 0, rows = document.querySelectorAll(".item-row");
    rows.forEach(row => {
      let price = Number(row.querySelector(".item-price").value) || 0,
          qty = Number(row.querySelector(".item-qty").value) || 0,
          t = price * qty;
      row.querySelector(".row-total").textContent = formatRupiah(t);
      total += t;
    });
    document.getElementById("itemCount").textContent = rows.length;
    document.getElementById("grandTotal").textContent = formatRupiah(total);
    calculatePayment();
  };

  function getGrandTotal() {
    let total = 0;
    document.querySelectorAll(".item-row").forEach(row => {
      total += (Number(row.querySelector(".item-price").value) || 0) * (Number(row.querySelector(".item-qty").value) || 0);
    });
    return total;
  }

  window.calculatePayment = function() {
    let total = getGrandTotal(),
        payment = Number(document.getElementById("payment")?.value) || 0,
        result = document.getElementById("paymentResult");
    if(!result) return;
    if(payment === total) result.innerHTML = `<div class="payment-result payment-lunas"><b>🟢 LUNAS</b><br>Pembayaran sesuai dengan total tagihan.</div>`;
    else if(payment < total) result.innerHTML = `<div class="payment-result payment-kurang"><b>🟠 KEKURANGAN</b><br>Masih kurang: <strong>${formatRupiah(total - payment)}</strong></div>`;
    else result.innerHTML = `<div class="payment-result payment-kembali"><b>🔵 KEMBALIAN</b><br>Kembalian: <strong>${formatRupiah(payment - total)}</strong></div>`;
  };

  window.saveSale = async function() {
    let customer = document.getElementById("customer").value.trim(),
        phone = document.getElementById("phone").value.trim(),
        date = document.getElementById("saleDate").value,
        payment = Number(document.getElementById("payment").value) || 0,
        dueDate = document.getElementById("dueDate").value,
        description = document.getElementById("description").value.trim(),
        jobStatus = document.getElementById("saleJobStatus")?.value || "",
        rows = document.querySelectorAll(".item-row");

    if(!customer) return alert("Nama pelanggan harus diisi.");
    let items = [];
    rows.forEach(row => {
      let name = row.querySelector(".item-name").value.trim(),
          price = Number(row.querySelector(".item-price").value) || 0,
          qty = Number(row.querySelector(".item-qty").value) || 0;
      if(name && price && qty) items.push({name, price, qty, total: price * qty});
    });
    if(!items.length) return alert("Minimal satu barang harus diisi.");

    let total = items.reduce((s, i) => s + i.total, 0),
        status = payment === total ? "Lunas" : payment < total ? "Kekurangan" : "Kembalian",
        difference = Math.abs(total - payment);

    try {
      await push(salesRef, {
        number: "TRX-" + Date.now().toString().slice(-6),
        customer, phone, date, items, total, payment, status, difference, dueDate, description,
        createdAt: new Date().toLocaleString("id-ID"),
        timestamp: Date.now()
      });

      const existingCustomer = customers.find(c => c.name === customer || (phone && c.phone === phone));
      if(existingCustomer) {
        await update(ref(db, "customers/" + existingCustomer.id), {name:customer, phone, updatedAt:Date.now()});
      } else {
        await push(customersRef, {name:customer, phone, address:"", createdAt:Date.now(), updatedAt:Date.now()});
      }

      if(jobStatus) {
        const jobName = items.map(i => `${i.name} (${i.qty}x)`).join(", ");
        await push(jobsRef, {
          number:"JOB-"+Date.now().toString().slice(-6),
          customer, title:jobName, description, status:jobStatus,
          dueDate, price:total, saleNumber:"TRX-"+Date.now().toString().slice(-6),
          createdAt:Date.now(), updatedAt:Date.now()
        });
      }
      closeModal();
    } catch (e) {
      alert("Gagal menyimpan ke Realtime Database: " + e.message);
    }
  };

  window.deleteSale = async function(id) {
    if(!confirm("Hapus transaksi ini dari Cloud?")) return;
    try {
      await remove(ref(db, "sales/" + id));
    } catch(e) {
      alert("Gagal menghapus: " + e.message);
    }
  };

  window.openFileModal = function() {
    openModal("Tambah File", `
      <div class="form-group"><label>Nama File</label><input id="fileName" placeholder="contoh.pdf"></div>
      <div class="form-group"><label>Kategori</label><select id="fileCategory"><option>Desain</option><option>Pelanggan</option><option>Invoice</option><option>Dokumen</option><option>Lainnya</option></select></div>
      <button class="submit" onclick="saveFile()">Simpan File (Cloud)</button>
    `);
  };

  window.saveFile = async function() {
    let name = document.getElementById("fileName").value.trim(),
        category = document.getElementById("fileCategory").value;
    if(!name) return alert("Nama file harus diisi.");

    try {
      await push(filesRef, {
        name, category,
        date: new Date().toLocaleString("id-ID"),
        timestamp: Date.now()
      });
      closeModal();
    } catch(e) {
      alert("Gagal menyimpan file: " + e.message);
    }
  };

  function renderSales(data = sales) {
    let list = document.getElementById("salesList");
    if(!data.length){ list.innerHTML = `<div class="empty">Belum ada transaksi.</div>`; return; }
    list.innerHTML = data.map(sale => {
      let cls = sale.status === "Lunas" ? "lunas" : sale.status === "Kekurangan" ? "kurang" : "kembali";
      let summary = sale.items ? sale.items.map(x => `${escapeHTML(x.name)} (${x.qty}×)`).join(", ") : "";
      let paymentText = sale.status === "Kekurangan" ? `Kurang ${formatRupiah(sale.difference)}` : sale.status === "Kembalian" ? `Kembalian ${formatRupiah(sale.difference)}` : "Pembayaran sesuai";
      return `
        <div class="sale-card">
          <div class="sale-top">
            <div>
              <div class="sale-customer">${escapeHTML(sale.customer)}</div>
              <div class="sale-number">${sale.number} · ${sale.date}</div>
            </div>
            <div class="sale-total">${formatRupiah(sale.total)}</div>
          </div>
          <div class="sale-info">${summary}</div>
          <span class="status ${cls}">${sale.status}</span>
          <div class="sale-info">Dibayar: <b>${formatRupiah(sale.payment)}</b> · ${paymentText}</div>
          ${sale.dueDate?`<div class="sale-info">📅 Jatuh tempo: <b>${formatDate(sale.dueDate)}</b></div>`:""}
          ${sale.description?`<div class="sale-info">📝 ${escapeHTML(sale.description)}</div>`:""}
          <div class="action-row">
            <button class="btn-sm btn-update" onclick="openUpdatePaymentModal('${sale.id}')"><svg class="icon-svg" style="width:14px;height:14px;"><use href="#icon-debt-collection-round"/></svg> Update Bayar</button>
            <button class="btn-sm btn-export" onclick="exportReceiptPNG('${sale.id}')">🖼️ Struk PNG</button>
            <button class="btn-sm btn-delete" onclick="deleteSale('${sale.id}')">Hapus</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderFiles(data = files) {
    let list = document.getElementById("filesList");
    if(!data.length){ list.innerHTML = `<div class="empty">Belum ada file.</div>`; return; }
    list.innerHTML = data.map(file => `<div class="file"><div class="file-icon">📄</div><div class="file-info"><div class="file-name">${escapeHTML(file.name)}</div><div class="file-meta">${escapeHTML(file.category)} · ${file.date}</div></div></div>`).join("");
  }

  window.searchSales = function(q) {
    q = q.toLowerCase();
    renderSales(sales.filter(s => (s.customer && s.customer.toLowerCase().includes(q)) || (s.items && s.items.some(i => i.name.toLowerCase().includes(q))) || (s.number && s.number.toLowerCase().includes(q))));
  };

  window.searchNotes = function(q) {
    q = q.toLowerCase();
    renderNotes(notes.filter(n => (n.title && n.title.toLowerCase().includes(q)) || (n.content && n.content.toLowerCase().includes(q))));
  };

  window.searchFiles = function(q) {
    q = q.toLowerCase();
    renderFiles(files.filter(f => f.name && f.name.toLowerCase().includes(q)));
  };

  function renderDashboard() {
    let total = sales.reduce((s, x) => s + (x.total || 0), 0);
    document.getElementById("dashboardSales").textContent = formatRupiah(total);
    document.getElementById("dashboardTransactions").textContent = sales.length;
    document.getElementById("dashboardNotes").textContent = notes.length;
    document.getElementById("dashboardFiles").textContent = files.length;
    document.getElementById("dashboardCustomers").textContent = customers.length;
    document.getElementById("dashboardJobs").textContent = jobs.filter(j=>!["Diambil","Dibatalkan"].includes(j.status)).length;
    document.getElementById("dashboardDebt").textContent = formatRupiah(sales.filter(s=>s.status==="Kekurangan").reduce((a,s)=>a+(Number(s.difference)||0),0));
    document.getElementById("salesTotal").textContent = formatRupiah(total);
    let recent = document.getElementById("recentSales");
    if(!sales.length){ recent.innerHTML = `<div class="card"><div class="empty">Belum ada transaksi.</div></div>`; return; }
    recent.innerHTML = sales.slice(0, 5).map(s => `<div class="sale-card"><div class="sale-top"><div><div class="sale-customer">${escapeHTML(s.customer)}</div><div class="sale-number">${s.number}</div></div><div class="sale-total">${formatRupiah(s.total)}</div></div><span class="status ${s.status==="Lunas"?"lunas":s.status==="Kekurangan"?"kurang":"kembali"}">${s.status}</span></div>`).join("");
  }

  window.openCurrentModal = function() {
    if(currentPage === "sales") openSaleModal();
    else if(currentPage === "notes") openNoteModal();
    else if(currentPage === "files") openFileModal();
    else if(currentPage === "customers") openCustomerModal();
    else if(currentPage === "jobs") openJobModal();
    else if(currentPage === "debts") openSaleModal();
    else openSaleModal();
  };

  function formatRupiah(value) { return new Intl.NumberFormat("id-ID", {style: "currency", currency: "IDR", maximumFractionDigits: 0}).format(value || 0); }
  function todayISO() { let d = new Date(), offset = d.getTimezoneOffset(), local = new Date(d.getTime() - offset * 60000); return local.toISOString().split("T")[0]; }
  function formatDate(value) { return new Date(value + "T00:00:00").toLocaleDateString("id-ID", {day: "numeric", month: "long", year: "numeric"}); }
  function escapeHTML(value) { return String(value || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

  function renderAll() {
    renderDashboard();
    renderSales();
    renderNotes();
    renderFiles();
    renderCustomers();
    renderJobs();
    renderDebts();
  }

  document.getElementById("today").textContent = new Date().toLocaleDateString("id-ID", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
</script>
</body>
</html>
